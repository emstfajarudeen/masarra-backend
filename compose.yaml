services:
  postgres:
    image: postgres:17-alpine
    container_name: masarra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: masarra
      POSTGRES_USER: masarra
      POSTGRES_PASSWORD: masarra_local_password
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U masarra -d masarra']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - masarra_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  masarra_postgres_data:
